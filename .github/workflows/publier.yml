# A chaque push sur main : genere les PDF a partir des pages HTML,
# puis publie le site (HTML + PDF) sur GitHub Pages.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Playwright (navigateur pour generer les PDF)
        run: |
          mkdir -p /tmp/pdf-tools && cd /tmp/pdf-tools
          npm init -y > /dev/null
          npm install playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Preparer le site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools' --exclude '_site' ./ _site/

      - name: Generer les PDF depuis fr.html et en.html
        run: NODE_PATH=/tmp/pdf-tools/node_modules node tools/make-pdf.cjs _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

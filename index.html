/* Mise en page : panneau identite (photo sombre, comme le bandeau du CV) a gauche,
   vitrine de projets interactive a droite. Tout tient dans un ecran, sans defilement. */
@font-face { font-family: "Roboto"; src: url("assets/fonts/roboto-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Roboto"; src: url("assets/fonts/roboto-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "Roboto"; src: url("assets/fonts/roboto-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: "Roboto"; src: url("assets/fonts/roboto-latin-500-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; font-display: swap; }
@font-face { font-family: "Merriweather"; src: url("assets/fonts/merriweather-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: "Merriweather"; src: url("assets/fonts/merriweather-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; font-display: swap; }

:root {
  --orange: #fa8f51;
  --teal: #65b998;
  --deep: #174b36;
  --bg: #fffdf2;
  --fg: #174b36;
  --muted: #4f6f60;
  --line: #dfe7dc;
  --chip: #eef5ee;
  --shade: rgba(9, 20, 15, .72);
  --on-photo: #fffdf2;
  --display: "Merriweather", Georgia, "Times New Roman", serif;
  --body: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a15; --fg: #e6eee7; --muted: #9fb5a8; --line: #26362d; --chip: #1b2a22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a15; --fg: #e6eee7; --muted: #9fb5a8; --line: #26362d; --chip: #1b2a22;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(300px, 34%) minmax(0, 1fr);
}

/* ---------- Panneau identite ---------- */
.id {
  position: relative;
  color: var(--on-photo);
  background:
    linear-gradient(180deg, rgba(8, 16, 12, .55), rgba(8, 16, 12, .82)),
    url("assets/header_bg.jpg") 30% center / cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: clamp(12px, 2.4vh, 24px);
  padding-block: clamp(14px, 3.6vh, 44px);
  padding-left: max(clamp(20px, 3vw, 48px), env(safe-area-inset-left, 0px));
  padding-right: clamp(20px, 3vw, 48px);
  min-height: 0;
}
.lang {
  display: inline-flex;
  align-self: flex-start;
  border: 1.5px solid rgba(255, 253, 242, .35);
  border-radius: 999px;
  padding: 3px;
}
.lang button {
  font: 700 13px/1 var(--body);
  letter-spacing: .06em;
  color: var(--on-photo);
  background: none;
  border: 0;
  border-radius: 999px;
  padding: 7px 12px;
  cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--teal); color: #fff; }

.who { display: flex; align-items: center; gap: 16px; }
.mascot { width: clamp(56px, 8.5vh, 96px); height: auto; flex: none; transform-origin: 50% 90%; }
.mascot:hover { animation: wobble .7s ease-in-out; }
@keyframes wobble { 30% { transform: rotate(-8deg); } 60% { transform: rotate(6deg); } }
h1 {
  font-family: var(--display);
  font-weight: 900;
  color: var(--orange);
  font-size: clamp(1.6rem, min(2.6vw, 4.6vh), 2.6rem);
  line-height: 1.08;
  margin: 0;
  text-wrap: balance;
}
.role { margin: 4px 0 0; color: var(--teal); font-weight: 700; font-size: clamp(.95rem, 1.15vw, 1.15rem); line-height: 1.3; }
.place { margin: 2px 0 0; font-size: .9rem; opacity: .85; }

.cvzone { display: grid; gap: 10px; }
.eyebrow { margin: 0; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #9fdcc3; }
.cvzone h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(1.1rem, min(1.7vw, 3vh), 1.7rem); line-height: 1.2; color: var(--on-photo); }
.cvs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cv {
  display: grid;
  gap: 10px;
  text-decoration: none;
  color: var(--on-photo);
}
.cv .paper {
  display: block;
  width: 100%;
  max-height: min(29vh, 300px);
  aspect-ratio: 1200 / 1697;
  object-fit: cover;
  object-position: top;
  border-radius: 6px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
  outline: 3px solid transparent;
  transition: transform .2s, outline-color .2s;
}
.cv .label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: var(--teal);
  color: #fff;
  flex-wrap: wrap;
  border-radius: 10px;
  padding: 10px 14px;
  transition: background-color .15s;
}
.cv .label strong { font-family: var(--display); font-size: 1.05rem; }
.cv .label span { font-weight: 700; font-size: .85rem; color: var(--deep); white-space: nowrap; }
.cv:hover .paper, .cv:focus-visible .paper { transform: translateY(-4px) rotate(-1deg); outline-color: var(--orange); }
.cv:hover .label, .cv:focus-visible .label { background: var(--orange); }
.cv:hover .label strong, .cv:focus-visible .label strong { color: var(--deep); }
.cv:hover .label span, .cv:focus-visible .label span { color: #fff; }
.cv:focus-visible { outline: none; }
.pdfs { margin: 0; font-size: .85rem; opacity: .9; }
.pdfs a { font-weight: 700; }

.links { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; font-size: .95rem; }
.links a { font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.links a:hover { color: var(--orange); }
.links svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mail { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mail code { font: 500 .95rem var(--body); user-select: all; }
.copy {
  font: 700 12px/1 var(--body);
  letter-spacing: .05em;
  color: var(--on-photo);
  background: rgba(255, 253, 242, .12);
  border: 1px solid rgba(255, 253, 242, .3);
  border-radius: 999px;
  padding: 6px 10px;
  cursor: pointer;
}
.copy:hover { background: rgba(255, 253, 242, .22); }

/* ---------- Vitrine ---------- */
.show {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: clamp(10px, 1.6vh, 18px);
  padding-block: clamp(14px, 2.6vh, 32px);
  padding-left: clamp(14px, 2vw, 32px);
  padding-right: max(clamp(14px, 2vw, 32px), env(safe-area-inset-right, 0px));
}
.stage {
  position: relative;
  min-height: 0;
  border-radius: 16px;
  overflow: hidden;
  background: #16191c;
}
.stage img, .stage video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity .45s ease;
}
.stage .fade { opacity: 0; }
.play {
  position: absolute;
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 0;
  background: var(--orange);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
  display: grid;
  place-items: center;
  cursor: pointer;
  z-index: 2;
}
.play svg { width: 28px; height: 28px; fill: var(--deep); }
.cap {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: clamp(18px, 3vh, 32px) clamp(18px, 2.4vw, 36px);
  background: linear-gradient(180deg, transparent, var(--shade) 38%);
  color: var(--on-photo);
  display: grid;
  gap: 6px;
}
.cap h2 {
  font-family: var(--display);
  font-weight: 900;
  font-size: clamp(1.6rem, 2.6vw, 2.5rem);
  line-height: 1.1;
  margin: 0;
  color: var(--orange);
  text-wrap: balance;
}
.cap .sub { margin: 0; color: #9fdcc3; font-style: italic; font-weight: 500; font-size: clamp(.95rem, 1.1vw, 1.1rem); }
.cap .desc { margin: 0; max-width: 64ch; font-size: clamp(.92rem, 1.05vw, 1.05rem); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.act {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-weight: 700;
  font-size: .9rem;
  text-decoration: none;
  color: #fff;
  background: var(--teal);
  border-radius: 999px;
  padding: 8px 14px;
  transition: background-color .15s;
}
.act:hover, .act:focus-visible { background: var(--orange); color: var(--deep); }
.act svg { width: 14px; height: 14px; fill: currentColor; }
.act.ghost { background: rgba(255, 253, 242, .14); }
.act.ghost:hover { background: var(--orange); }

.strip-wrap { min-width: 0; display: grid; gap: 8px; }
.strip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.strip-head p { margin: 0; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.strip-head .count { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.strip {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: clamp(6px, .8vw, 12px);
  margin: 0;
  padding: 0;
  list-style: none;
}
.thumb {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1;
  max-height: 13vh;
  padding: 0;
  border: 0;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  background: var(--chip);
  opacity: .62;
  transition: opacity .2s, transform .2s;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:hover { opacity: 1; transform: translateY(-2px); }
.thumb[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 3px var(--orange); }
.thumb .bar {
  position: absolute;
  left: 0; bottom: 0;
  height: 4px;
  width: 0;
  background: var(--orange);
}
.strip-head .hint { text-transform: none; letter-spacing: 0; font-weight: 500; }

@media (prefers-reduced-motion: reduce) {
  .thumb .bar.run, .mascot:hover { animation: none; }
}

/* ---------- Ecrans etroits : on empile, la page peut defiler ---------- */
@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: 1fr; }
  .id {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    gap: 20px;
  }
  .show {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .stage { aspect-ratio: 4 / 5; max-width: 100%; }
  .strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .thumb { max-height: none; }
}
@media (min-width: 861px) and (max-height: 700px) {
  .place { display: none; }
  .lang button { padding: 6px 11px; }
}
</style>
</head>

    explain: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2v2c-2.5 0-2.5-2-5-2s-2.5 2-5 2-2.5-2-5-2-2.5 2-5 2zM2 9c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2v2c-2.5 0-2.5-2-5-2s-2.5 2-5 2-2.5-2-5-2-2.5 2-5 2z"/></svg>'
  };

  var lang = "fr";
  try { lang = localStorage.getItem("cg-lang") || ((navigator.language || "fr").slice(0, 2) === "fr" ? "fr" : "en"); } catch (e) {}

  // Les videos sont le contenu de la page : elles jouent meme si l'appareil demande de reduire les animations
  // (seules les animations decoratives, comme la mandarine, sont coupees en CSS dans ce cas).
  var reduce = false;
  var cur = 0, timer = null, paused = false, front = "a";
  var $ = function (id) { return document.getElementById(id); };
  var strip = $("strip"), vid = $("vid"), show = $("show");
  var base = "assets/landing/";

  function nm(p) { return typeof p.name === "string" ? p.name : p.name[lang]; }

  P.forEach(function (p, i) {
    var li = document.createElement("li");
    li.innerHTML = '<button class="thumb" type="button" id="t-' + p.id + '" aria-pressed="false">' +
      '<img src="' + base + p.id + '_t.jpg" alt="" width="240" height="240"><span class="bar"></span></button>';
    li.firstChild.addEventListener("click", function () { go(i, true); });
    strip.appendChild(li);
  });

  function render() {
    var p = P[cur];
    $("p-name").textContent = nm(p);
    $("p-sub").textContent = p.sub[lang];
    $("p-desc").textContent = p.desc[lang];
    $("p-acts").innerHTML = p.links.map(function (l, j) {
      return '<a class="act' + (j ? " ghost" : "") + '" href="' + l.u + '" target="_blank" rel="noopener">' + ICON[l.k] + T[l.k][lang] + "</a>";
    }).join("");
    $("count").textContent = (cur + 1) + " / " + P.length;
    P.forEach(function (q, i) {
      var b = $("t-" + q.id);
      b.setAttribute("aria-pressed", i === cur ? "true" : "false");
      b.setAttribute("aria-label", nm(q));
    });
  }

  function bar() { return document.querySelector('.thumb[aria-pressed="true"] .bar'); }
  function resetBars() { document.querySelectorAll(".thumb .bar").forEach(function (x) { x.style.width = "0"; }); }

  // Cadrage. Pour les projets "contain" (grille des materiaux), on calcule nous-memes la taille
  // et la position de l'image/video : Safari applique mal object-fit:contain aux premieres images d'une video.
  var AR = { materials: 1292 / 644 };
  function place(el, p) {
    if ((p.fit || "cover") === "contain" && AR[p.id]) {
      var st = $("stage"), W = st.clientWidth, H = st.clientHeight, ar = AR[p.id], w, h;
      if (W / H > ar) { h = H; w = H * ar; } else { w = W; h = W / ar; }
      el.style.objectFit = "fill";
      el.style.width = w + "px"; el.style.height = h + "px";
      el.style.left = ((W - w) / 2) + "px"; el.style.top = ((H - h) * 0.25) + "px";
      el.style.right = "auto"; el.style.bottom = "auto";
    } else {
      el.style.objectFit = "cover";
      el.style.width = "100%"; el.style.height = "100%";
      el.style.left = "0"; el.style.top = "0"; el.style.right = ""; el.style.bottom = "";
    }
  }
  addEventListener("resize", function () {
    var p = P[cur];
    [vid, anim, $("img-" + front)].forEach(function (el) { place(el, p); });
  });

  var lastFit = "cover";
  function swap() {
    var p = P[cur];
    var fit = p.fit || "cover";
    var next = front === "a" ? "b" : "a";
    var nImg = $("img-" + next), fImg = $("img-" + front);
    var room = "0";
    nImg.style.objectPosition = p.pos;
    place(nImg, p);
    // quand on passe d'un cadrage plein ecran a la grille (ou l'inverse), pas de fondu entre les
    // deux images : le melange d'une image pleine et d'une grille plus petite donnait un effet de zoom.
    var cut = fit !== lastFit;
    lastFit = fit;
    if (cut) { fImg.style.transition = "none"; fImg.classList.add("fade"); void fImg.offsetWidth; fImg.style.transition = ""; }
    nImg.onload = function () {
      nImg.onload = null;
      nImg.classList.remove("fade");
      fImg.classList.add("fade");
      front = next;
    };
    nImg.src = base + p.id + ".jpg";
    if (nImg.complete && nImg.onload) nImg.onload();

    // on cache instantanement l'ancienne video / image animee (sans fondu), avant de changer leur cadrage
    [vid, anim].forEach(function (el) { el.style.transition = "none"; el.classList.add("fade"); void el.offsetWidth; el.style.transition = ""; });
    animTemp = false;
    try { vid.pause(); } catch (e) {}
    resetBars();
    clearTimeout(timer);
    clearTimeout(check);
    if (reduce) return;
    [vid, anim].forEach(function (el) {
      el.style.objectPosition = p.pos;
      place(el, p);
    });
    if (useAnim) { showAnim(p); return; }
    vid.muted = true;
    vid.defaultMuted = true;
    // on vide d'abord la video (Safari garde sinon la derniere image du projet precedent)
    vid.removeAttribute("src");
    try { vid.load(); } catch (e) {}
    vid.src = base + p.id + ".mp4";
    vid.load();
    var pr = vid.play();
    // Refus explicite du navigateur : on passe pour de bon aux images animees.
    if (pr && pr.catch) pr.catch(function (err) { if (err && err.name === "NotAllowedError") toAnim(); });
    var t0 = Date.now();
    (function watch() {
      check = setTimeout(function () {
        if (isPlaying()) return;
        // Video prete mais figee (cas de Safari), ou toujours rien apres 15 s : image animee.
        if (vid.readyState >= 2 && Date.now() - t0 > 4000) { toAnim(); return; }
        if (Date.now() - t0 > 15000) { toAnim(); return; }
        watch();                                         // encore en chargement : on attend
      }, 1000);
    })();
  }

  function isPlaying() { return !vid.paused && vid.readyState >= 2 && vid.currentTime > 0.05; }

  // Secours image animee
  var anim = $("anim"), useAnim = false, check = null, animTemp = false;
  var DUR = { shoreline: 12, tevarua: 8, lighthouse: 12, curiosity: 8.5, underwater: 9, pagoda: 8.6, market: 5.9, materials: 10 };
  function toAnim() {
    clearTimeout(check);
    if (useAnim) return;
    useAnim = true;
    try { vid.pause(); } catch (e) {}
    vid.removeAttribute("src");
    showAnim(P[cur], false);
  }
  function showAnim(p, temp) {
    animTemp = !!temp;
    var t0 = Date.now(), d = (DUR[p.id] || 9) * 1000;
    anim.onload = function () { anim.onload = null; anim.classList.remove("fade"); };
    anim.src = base + p.id + "_a.webp";
    clearTimeout(timer);
    (function tick() {
      if (animTemp && isPlaying()) return;           // la video a pris le relais
      var b = bar(), el = Date.now() - t0;
      if (b) b.style.width = Math.min(100, 100 * el / d) + "%";
      if (el >= d && !paused) { go((cur + 1) % P.length, false); return; }
      timer = setTimeout(tick, 200);
    })();
  }

  // Ne montrer la video qu'une fois sa premiere image vraiment affichee (Safari annonce
  // "playing" avant d'avoir peint l'image, ce qui laissait voir un instant l'ancienne).
  function revealVideo() {
    var src = vid.currentSrc;
    function show() { if (vid.currentSrc === src && !useAnim) vid.classList.remove("fade"); }
    if (vid.requestVideoFrameCallback) vid.requestVideoFrameCallback(function () { show(); });
    else {
      var on = function () { if (vid.currentTime > 0.04) { vid.removeEventListener("timeupdate", on); show(); } };
      vid.addEventListener("timeupdate", on);
    }
  }
  vid.addEventListener("playing", function () {
    clearTimeout(check);
    if (useAnim) return;
    revealVideo();
    if (animTemp) {                                    // la video arrive : on retire l'image animee
      animTemp = false;
      clearTimeout(timer);
      anim.classList.add("fade");
      try { vid.currentTime = 0; } catch (e) {}
    }
  });
  vid.addEventListener("timeupdate", function () {
    var b = bar();
    if (!useAnim && !animTemp && b && vid.duration) b.style.width = (100 * vid.currentTime / vid.duration) + "%";
  });
  vid.addEventListener("ended", function () {
    if (useAnim) return;
    if (paused) { vid.currentTime = 0; vid.play().catch(function () {}); }
    else go((cur + 1) % P.length, false);
  });
  vid.addEventListener("error", function () { if (vid.getAttribute("src")) toAnim(); });

  function go(i, user) {
    cur = i;
    render();
    swap();
    if (user) $("t-" + P[i].id).focus({ preventScroll: true });
  }

  // pause au survol, seulement avec une souris (sur ecran tactile, toucher ne doit pas bloquer la vitrine)
  var lastTouch = 0;
  addEventListener("touchstart", function () { lastTouch = Date.now(); paused = false; }, { passive: true, capture: true });
  function isMouse(e) { return e.pointerType === "mouse" && Date.now() - lastTouch > 1500; }
  show.addEventListener("pointerenter", function (e) { if (isMouse(e)) paused = true; });
  show.addEventListener("pointerleave", function (e) { if (isMouse(e)) paused = false; });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go((cur + 1) % P.length, true);
    else if (e.key === "ArrowLeft") go((cur - 1 + P.length) % P.length, true);
  });

  function setLang(l) {
    lang = l;
    document.documentElement.lang = l;
    try { localStorage.setItem("cg-lang", l); } catch (e) {}
    document.querySelectorAll("[data-" + l + "]").forEach(function (el) { el.textContent = el.getAttribute("data-" + l); });
    document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.lang === l ? "true" : "false"); });
    render();
  }
  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () { setLang(b.dataset.lang); });
  });

  $("copy").addEventListener("click", function () {
    var btn = this, txt = $("mail").textContent;
    function done() { btn.textContent = T.copied[lang]; setTimeout(function () { btn.textContent = btn.getAttribute("data-" + lang); }, 1600); }
    function sel() {
      var r = document.createRange(); r.selectNodeContents($("mail"));
      var s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
    try { navigator.clipboard.writeText(txt).then(done, sel); } catch (e) { sel(); }
  });

  setLang(lang);
  go(0, false);
})();
</script>
